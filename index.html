</style></head><body><header><div class="brand"><span>σ</span><span style="color:#c7d8dc;font-weight:400;margin-left:10px">Statistiques · QCM 6</span></div><div class="header-note">Master 2 NCC</div></header><main><div id="quiz" class="layout"><div><section class="data card" aria-label="Énoncé et données"><h2 id="statement-title" tabindex="-1">Énoncé</h2><p id="case-summary"></p><div id="case-data"></div></section><section id="question-card" class="card" aria-labelledby="question-title"></section></div><aside class="aside"><section class="card side"><h2 class="aside-title">Votre progression</h2><div id="answered" aria-live="polite"></div><div class="progress" role="progressbar" aria-label="Questions répondues" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="bar"></div></div><nav class="grid" id="question-nav" aria-label="Navigation entre les questions"></nav><p class="micro">Vous pouvez passer une question ou choisir « Je ne sais pas ». Une réponse absente vaut 0 point. Vous pouvez modifier vos choix avant l’envoi.</p><button id="finish" class="btn primary">Terminer et envoyer mes réponses</button><p id="message" class="error" role="status"></p></section></aside></div><section id="results" class="hidden" aria-labelledby="results-title"></section></main><script>
const questions=[{"kind": "theory", "question": "Dans un test t apparié, pour un petit échantillon, la normalité concerne principalement :", "options": ["La distribution des différences entre les deux mesures.", "La distribution des identifiants des participants.", "La distribution des variances.", "Le nombre de participants dans chaque groupe."], "answer": 0, "explanation": "Le test porte sur les différences individuelles. C’est leur distribution qui doit être examinée, notamment pour un petit échantillon.", "id": 1, "exercise": 1}, {"kind": "theory", "question": "Pour deux groupes indépendants, le test t de Welch présente l’avantage de :", "options": ["N’exiger aucune indépendance entre observations.", "Comparer directement trois moyennes.", "Ne pas supposer l’égalité des variances des populations.", "Tester l’égalité des médianes à partir des rangs."], "answer": 2, "explanation": "Le test de Welch adapte l’erreur standard et les degrés de liberté lorsque les variances ne sont pas supposées égales.", "id": 2, "exercise": 2}, {"kind": "theory", "question": "Dans une ANOVA classique à groupes indépendants, F est :", "options": ["La somme des deux carrés moyens.", "Le carré moyen inter-groupes divisé par le carré moyen intra-groupes.", "Le carré moyen intra-groupes divisé par le nombre de groupes.", "La différence des moyennes divisée par la moyenne générale."], "answer": 1, "explanation": "F = CM inter / CM intra. Sous H₀ et les conditions de l’ANOVA, ces deux carrés moyens estiment la même variance résiduelle.", "id": 3, "exercise": 3}, {"kind": "theory", "question": "Pour interpréter Wilcoxon apparié comme un test de décalage de position centré sur zéro, on suppose notamment :", "options": ["Que les deux conditions proviennent de personnes distinctes.", "Que toutes les différences sont positives.", "Que la corrélation est nulle.", "Que la distribution des différences est symétrique."], "answer": 3, "explanation": "L’interprétation habituelle en termes de décalage de position suppose la symétrie des différences. Le test n’est pas un test universel de la seule médiane sans cette condition.", "id": 4, "exercise": 4}, {"kind": "theory", "question": "Interpréter Mann–Whitney uniquement comme une comparaison de médianes demande notamment :", "options": ["Des distributions de forme et de dispersion comparables.", "Une corrélation égale à 1 entre les groupes.", "Que toutes les valeurs soient différentes de zéro.", "Au moins trois groupes."], "answer": 0, "explanation": "Mann–Whitney peut réagir à des différences de distribution autres qu’une médiane. Une interprétation en termes de décalage de position demande des formes et dispersions comparables.", "id": 5, "exercise": 5}, {"kind": "theory", "question": "Dans le test de Friedman, les rangs sont attribués :", "options": ["Sur toutes les observations réunies, sans tenir compte des personnes.", "Uniquement aux moyennes de chaque condition.", "Entre les conditions, séparément pour chaque personne.", "Uniquement aux écarts-types."], "answer": 2, "explanation": "Chaque personne constitue un bloc. On classe ses scores entre les conditions, puis on compare les sommes de rangs des conditions.", "id": 6, "exercise": 6}, {"kind": "theory", "question": "Un test de Kruskal–Wallis significatif permet directement de conclure :", "options": ["Que toutes les paires de groupes diffèrent.", "À une différence globale de distribution entre les groupes.", "À une égalité des variances.", "À une relation linéaire entre deux variables."], "answer": 1, "explanation": "Kruskal–Wallis est un test global. Des comparaisons complémentaires sont nécessaires pour localiser les différences. Une interprétation centrée sur les médianes demande des conditions supplémentaires.", "id": 7, "exercise": 7}, {"kind": "theory", "question": "Dans une régression, un résidu est habituellement :", "options": ["La pente divisée par l’effectif.", "La valeur prédite divisée par la valeur observée.", "La moyenne de la variable explicative.", "La valeur observée moins la valeur prédite."], "answer": 3, "explanation": "Le résidu est e = Y − Ŷ. Il est positif si l’observation dépasse la prédiction.", "id": 8, "exercise": 8}, {"kind": "theory", "question": "Une corrélation de Pearson proche de −1 indique :", "options": ["Une forte relation linéaire décroissante.", "Une absence de relation.", "Une causalité certaine de X sur Y.", "Une proportion de variance expliquée négative."], "answer": 0, "explanation": "Une corrélation négative de grande valeur absolue indique une forte association linéaire décroissante. Elle n’établit pas une causalité.", "id": 9, "exercise": 9}, {"kind": "theory", "question": "Après plusieurs comparaisons entre groupes, une correction comme celle de Holm vise à :", "options": ["Rendre toutes les différences significatives.", "Augmenter systématiquement la taille des effets.", "Contrôler le risque global d’au moins un faux positif dans la famille de tests.", "Remplacer les données manquantes."], "answer": 2, "explanation": "La multiplication des tests augmente le risque de faux positif. La correction de Holm permet de contrôler ce risque pour l’ensemble des comparaisons considérées.", "id": 10, "exercise": 10}, {"kind": "exercise", "question": "Quelle conclusion est correcte à 5 % pour ce test bilatéral ?", "options": ["La différence n’est pas significative car elle est négative.", "La différence est significative et la moyenne du groupe 1 est inférieure.", "Les moyennes sont équivalentes.", "Il est impossible de comparer un t négatif à une valeur critique."], "answer": 1, "explanation": "|t| = 2,4 > 2,1 : on rejette H₀. Comme le calcul utilise groupe 1 moins groupe 2 et donne une valeur négative, la moyenne observée du groupe 1 est inférieure.", "statement": "Deux groupes indépendants sont comparés sur leur temps de réponse. Le test t, calculé comme groupe 1 moins groupe 2, vaut −2,4. La valeur critique bilatérale à 5 % pour les degrés de liberté considérés vaut ±2,1.", "id": 11, "exercise": 11}, {"kind": "exercise", "question": "Quelle est la valeur du t apparié ?", "options": ["−0,5.", "−1,5.", "+2,0.", "−2,0."], "answer": 3, "explanation": "L’erreur standard vaut 6 / √16 = 1,5. t = −3 / 1,5 = −2. Le signe indique une baisse moyenne de 3 secondes après entraînement.", "statement": "Chez 16 personnes, on calcule la différence du temps d’exécution après entraînement moins avant entraînement. La moyenne des différences vaut −3 secondes et leur écart-type vaut 6 secondes. Les conditions du test sont considérées comme satisfaites.", "id": 12, "exercise": 12}, {"kind": "exercise", "question": "Quels sont les degrés de liberté de F pour cette ANOVA ?", "options": ["3 et 28.", "4 et 32.", "3 et 31.", "4 et 28."], "answer": 0, "explanation": "Les degrés de liberté sont k − 1 = 4 − 1 = 3 pour le numérateur et N − k = 32 − 4 = 28 pour le dénominateur.", "statement": "Une ANOVA classique compare quatre groupes indépendants de huit personnes chacun sur un score d’attention.", "id": 13, "exercise": 13}, {"kind": "exercise", "question": "Quel est le F calculé à partir de ces informations ?", "options": ["2.", "4.", "6.", "12."], "answer": 2, "explanation": "CM inter = 90 / 3 = 30. CM intra = 140 / 28 = 5. F = 30 / 5 = 6.", "statement": "Pour l’ANOVA précédente, la somme des carrés inter-groupes vaut 90 et la somme des carrés intra-groupes vaut 140. Les degrés de liberté sont 3 et 28.", "id": 14, "exercise": 14}, {"kind": "exercise", "question": "Pour Wilcoxon, quelle est la somme des rangs négatifs ?", "options": ["13.", "8.", "21.", "6."], "answer": 1, "explanation": "Les différences négatives sont −3 et −5. Leurs valeurs absolues occupent les rangs 3 et 5. La somme des rangs négatifs vaut 3 + 5 = 8.", "statement": "Six personnes passent deux conditions. Les différences individuelles sont +1, +2, −3, +4, −5 et +6. Pour Wilcoxon apparié, on classe les valeurs absolues des différences. Il n’y a ni zéro ni ex æquo.", "id": 15, "exercise": 15}, {"kind": "exercise", "question": "Quelle est la valeur de U₁ selon cette convention ?", "options": ["19.", "15.", "10.", "4."], "answer": 3, "explanation": "U₁ = 19 − 5 × 6/2 = 19 − 15 = 4. L’autre statistique vaut U₂ = 25 − 4 = 21.", "statement": "Deux groupes indépendants de cinq personnes sont comparés avec Mann–Whitney. La somme des rangs du groupe 1 vaut R₁ = 19. Utiliser U₁ = R₁ − n₁(n₁ + 1)/2.", "id": 16, "exercise": 16}, {"kind": "exercise", "question": "Quelle est la statistique Q de Friedman selon la formule donnée ?", "options": ["3.", "6.", "9.", "12."], "answer": 0, "explanation": "ΣRⱼ² = 9² + 12² + 15² = 450. Q = 12 × 450 / (6 × 3 × 4) − 3 × 6 × 4 = 75 − 72 = 3.", "statement": "Six personnes passent trois conditions. Après classement à l’intérieur de chaque personne, les sommes de rangs des conditions valent 9, 12 et 15. Il n’y a pas d’ex æquo. Utiliser Q = [12 / (n × k × (k + 1))] × ΣRⱼ² − 3n(k + 1), avec n = 6 et k = 3.", "id": 17, "exercise": 17}, {"kind": "exercise", "question": "Quelle conclusion peut-on retenir au seuil de 5 % ?", "options": ["Les trois groupes sont équivalents.", "Les trois paires diffèrent nécessairement.", "Il existe une différence globale ; des comparaisons supplémentaires permettraient de la localiser.", "Le test doit être interprété comme une corrélation négative."], "answer": 2, "explanation": "p = 0,008 < 0,05 : le test global rejette H₀. Il ne suffit pas pour identifier les paires de groupes qui diffèrent.", "statement": "Trois groupes indépendants de patients passent une tâche dont les scores sont comparés avec Kruskal–Wallis. Le logiciel rapporte une valeur p = 0,008.", "id": 18, "exercise": 18}, {"kind": "exercise", "question": "Quel est le résidu de cette personne ?", "options": ["−2 points.", "+2 points.", "16 points.", "34 points."], "answer": 1, "explanation": "Le score prédit vaut 4 + 1,5 × 8 = 16. Le résidu est Y − Ŷ = 18 − 16 = +2 points.", "statement": "Une régression prédit un score de rappel Y à partir du nombre de séances X : Ŷ = 4 + 1,5X. Une personne ayant réalisé 8 séances obtient un score observé de 18.", "id": 19, "exercise": 19}, {"kind": "exercise", "question": "Quelle est la statistique t pour tester une corrélation de population nulle ?", "options": ["0,75.", "2,40.", "4,00.", "3,00."], "answer": 3, "explanation": "n − 2 = 16 et 1 − r² = 0,64. t = 0,60 × √(16 / 0,64) = 0,60 × 5 = 3, avec 16 degrés de liberté.", "statement": "Dans une régression linéaire simple avec constante, n = 18 et r = 0,60. Utiliser t = r × √[(n − 2) / (1 − r²)]. Les conditions du test de corrélation sont considérées comme satisfaites.", "id": 20, "exercise": 20}];
let current=0;let answers=Array(questions.length).fill(null);let completed=false;
const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const letter=i=>'ABCD'[i];
function renderQuestion(focus=false){const q=questions[current];$('question-card').innerHTML=`<div class="qtop"><span>QUESTION ${q.id} / 20</span></div><h2 id="question-title" tabindex="-1">${escape(q.question)}</h2><fieldset><legend>Choisissez une seule réponse</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span class="letter">${letter(i)}</span><span class="option-text">${escape(o)}</span></label>`).join('')}</div></fieldset><button type="button" class="btn" id="clear-answer" style="margin-top:16px">Je ne sais pas / laisser sans réponse</button><div class="bottom"><button class="btn" id="prev" ${current===0?'disabled':''}>Précédente</button><button class="btn primary" id="next">${current===19?'Voir ma progression':'Question suivante'}</button></div>`;
$('question-card').querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{answers[current]=Number(r.value);$('message').textContent='';renderProgress();}));$('clear-answer').onclick=()=>{answers[current]=null;renderQuestion(true);};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>{if(current<19)go(current+1);else{$('finish').scrollIntoView({behavior:'smooth',block:'center'});$('finish').focus();}};renderProgress();const dataPanel=document.querySelector('.data');dataPanel.classList.toggle('hidden',!q.statement);$('case-summary').textContent='';$('case-data').innerHTML=q.statement?`<p>${escape(q.statement)}</p>`:'';if(focus)$('question-title').focus({preventScroll:true});}
function renderProgress(){let n=answers.filter(a=>a!==null).length;$('answered').textContent=`${n} réponse${n>1?'s':''} sur 20`;$('bar').style.width=`${n/20*100}%`;document.querySelector('.progress').setAttribute('aria-valuenow',n);$('question-nav').innerHTML=questions.map((q,i)=>`<button class="navq ${answers[i]!==null?'done':''}" aria-current="${i===current}" aria-label="Question ${i+1}, ${answers[i]!==null?'répondue':'sans réponse'}" data-q="${i}">${i+1}</button>`).join('');$('question-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.q)));}
function go(i){if(i<0||i>=20||completed)return;const changed=questions[i].exercise!==questions[current].exercise;current=i;renderQuestion(!changed);if(changed&&questions[current].statement){$('statement-title').focus({preventScroll:true});$('statement-title').scrollIntoView({behavior:'smooth',block:'start'});}else{$('question-card').scrollIntoView({behavior:'smooth',block:'start'});}}
$('finish').onclick=()=>{completed=true;const score=answers.filter((a,i)=>a===questions[i].answer).length;$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<div class="card results-head"><div class="score">${score}<small> / 20</small></div><div><p class="eyebrow">Votre résultat</p><h2 id="results-title" tabindex="-1">${score===20?'Toutes les réponses sont correctes.':'Le corrigé pour comprendre vos réponses.'}</h2><p class="sub">${score} bonne${score>1?'s':''} réponse${score>1?'s':''} · ${Math.round(score/20*100)} % de réussite.</p><div class="result-actions"><button class="btn primary" id="retry">Recommencer le QCM</button><button class="btn" id="print">Imprimer le corrigé</button></div></div></div>${questions.map((q,i)=>`<article class="card review"><p class="tag ${answers[i]===q.answer?'':'wrong'}">Question ${q.id} · ${answers[i]===null?'Sans réponse':answers[i]===q.answer?'Bonne réponse':'À revoir'}</p><h3>${escape(q.question)}</h3><p class="answer-line">${answers[i]===null?'<strong>Vous avez laissé cette question sans réponse.</strong>':`<strong>Votre réponse ${letter(answers[i])} :</strong> ${escape(q.options[answers[i]])}`}</p>${answers[i]!==q.answer?`<p class="answer-line"><strong>Bonne réponse ${letter(q.answer)} :</strong> ${escape(q.options[q.answer])}</p>`:''}<p class="explain">${escape(q.explanation)}</p></article>`).join('')}`;$('retry').onclick=()=>{answers=Array(20).fill(null);current=0;completed=false;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('message').textContent='';renderQuestion(true);window.scrollTo({top:0,behavior:'smooth'});};$('print').onclick=()=>window.print();$('results-title').focus();window.scrollTo({top:0,behavior:'smooth'});};renderQuestion();
</script><script>window.QCM_RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxxBUVfyHRBsVf62bA85YS2ykNneWUYAQp3bptzkI8snQRos3BcQqgDmh1Kvv2aCD_9/exec";
/* Suivi facultatif des tentatives, indépendant de l’hébergeur du QCM. */
(() => {
  const endpoint = window.QCM_RESULTS_ENDPOINT;
  if (!endpoint) return;
  let startedAt;
  let studentAlias = '';
  const quizPanel = document.getElementById('quiz');
  const welcome = document.createElement('section');
  welcome.className = 'card';
  welcome.id = 'welcome';
  welcome.innerHTML = `<h2>Avant de commencer</h2><p>Saisissez votre prénom et l'initiale de votre nom</p>
    <form id="start-form"><label for="start-alias">Votre nom</label><br><input id="start-alias" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px">
    
    <button class="btn primary" type="submit">Commencer le QCM</button><p id="start-error" role="status"></p></form>`;
  quizPanel.before(welcome);
  quizPanel.classList.add('hidden');
  welcome.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('start-alias');
    studentAlias = input.value.trim();
    if (studentAlias.length < 2 || /[\x00-\x1f\x7f]/.test(studentAlias)) { document.getElementById('start-error').textContent = 'Saisissez un nom valide (2 à 60 caractères).'; return; }
    startedAt = new Date().toISOString();
    welcome.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    document.getElementById('question-title').focus({preventScroll:true});
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const finish = document.getElementById('finish');
  finish.addEventListener('click', () => {
    if (!completed) return;
    const attempt = {
      version: 1,
      quizId: 'qcm6-v1',
      attemptId: crypto.randomUUID(),
      startedAt,
      finishedAt: new Date().toISOString(),
      answers: answers.map((value, index) => ({questionId: questions[index].id, answer: value})),
    };
    const section = document.createElement('section');
    section.className = 'card';
    section.setAttribute('aria-labelledby', 'tracking-title');
    section.innerHTML = `<h2 id="tracking-title">Envoyer mes réponses pour voir ma note</h2>
      <p>Pour suivre votre progression, utilisez le même nom à chaque tentative. </p>
      <form id="tracking-form"><label for="student-alias">Votre nom</label><br>
      <input id="student-alias" name="alias" type="text" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px">
      <div><button class="btn primary" type="submit">Envoyer mon résultat</button></div>
      <p id="tracking-status" role="status" aria-live="polite" style="margin-top:12px"></p></form>`;
    const resultPanel = document.getElementById('results');
    const correction = document.createElement('div');
    correction.className = 'hidden';
    correction.id = 'correction';
    while(resultPanel.firstChild) correction.appendChild(resultPanel.firstChild);
    resultPanel.append(section, correction);
    resultPanel.setAttribute('aria-labelledby', 'tracking-title');
    const omitted = answers.filter(a => a === null).length;
    const summary = document.createElement('p');
    summary.textContent = `${answers.length - omitted} réponse(s) renseignée(s), ${omitted} question(s) sans réponse. La note et le corrigé apparaîtront après l’envoi.`;
    section.querySelector('h2').after(summary);
    section.style.marginBottom = "24px";
    const form = section.querySelector('form');
    const status = section.querySelector('#tracking-status');
    const alias = section.querySelector('input');
    const button = section.querySelector('button');
    alias.value = studentAlias;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (alias.value.trim().length < 2) { status.textContent = 'Saisissez un nom d’au moins deux caractères.'; return; }
      button.disabled = true;
      alias.disabled = true;
      status.textContent = 'Envoi en cours…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=UTF-8'},
          body: JSON.stringify({...attempt, alias: alias.value.trim()}),
          signal: controller.signal,
          credentials: 'omit',
        });
        if (!response.ok) throw new Error('HTTP');
        const result = await response.json();
        if (result.ok !== true || result.attemptId !== attempt.attemptId) throw new Error('Unconfirmed');
        status.textContent = 'Votre résultat a bien été enregistré. Vous pouvez consulter le corrigé ci-dessous.';
        button.textContent = 'Résultat envoyé';
        correction.classList.remove('hidden');
        resultPanel.setAttribute('aria-labelledby', 'results-title');
        document.getElementById('results-title').focus();
      } catch (_) {
        status.textContent = 'L’enregistrement n’a pas pu être confirmé. La note et le corrigé restent masqués. Vous pouvez réessayer : cette tentative ne sera pas comptée deux fois.';
        button.disabled = false;
        alias.disabled = false;
        button.textContent = 'Réessayer l’envoi';
      } finally { clearTimeout(timeout); }
    });
    document.getElementById('tracking-title').setAttribute('tabindex', '-1');
    document.getElementById('tracking-title').focus();
    document.getElementById('retry').addEventListener('click', () => {
      quizPanel.classList.add('hidden');
      welcome.classList.remove('hidden');
      document.getElementById('start-alias').value = studentAlias;
      document.getElementById('start-alias').focus();
    });
  });
})();
</script></body></html>
